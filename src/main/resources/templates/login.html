<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MP09 Saloon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a96e;
            --dark: #1a1612;
            --dark2: #2c2520;
            --cream: #f5f0e8;
            --text-muted: #9a8f82;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--dark);
            color: var(--cream);
            font-family: 'Jost', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--dark2);
            border: 1px solid rgba(201,169,110,0.2);
            padding: 48px;
        }
        .login-logo {
            font-size: 22px;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-sub {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 40px;
        }
        .form-label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .form-control {
            background: var(--dark) !important;
            border: 1px solid rgba(201,169,110,0.2) !important;
            color: var(--cream) !important;
            padding: 12px 16px;
            font-size: 14px;
            border-radius: 0 !important;
        }
        .form-control:focus {
            border-color: var(--gold) !important;
            box-shadow: none !important;
        }
        .form-control::placeholder {
            color: var(--text-muted) !important;
        }
        .btn-login {
            width: 100%;
            background: var(--gold);
            color: var(--dark);
            border: none;
            padding: 14px;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 0;
            margin-top: 24px;
        }
        .btn-login:hover {
            background: #e8d5b0;
        }
        .error-msg {
            background: rgba(220,53,69,0.15);
            border: 1px solid rgba(220,53,69,0.3);
            color: #dc3545;
            padding: 12px 16px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }
        .mb-3 { margin-bottom: 20px !important; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="login-logo">MP09 Saloon</div>
    <div class="login-sub">Admin Panel</div>

    <!-- ERROR MESSAGE -->
    <div class="error-msg" th:if="${param.error}">
        Invalid username or password!
    </div>

    <!-- SUCCESS LOGOUT MESSAGE -->
    <div style="background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.3); color: #28a745; padding: 12px 16px; font-size: 13px; text-align: center; margin-bottom: 20px;"
         th:if="${param.logout}">
        Successfully logged out!
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text"
                   class="form-control"
                   name="username"
                   placeholder="Enter username"
                   required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   name="password"
                   placeholder="Enter password"
                   required>
        </div>
        <button type="submit" class="btn-login">Login to Dashboard</button>
    </form>
</div>

</body>
</html>
