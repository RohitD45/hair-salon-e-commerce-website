<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MP09 Saloon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #c9a96e;
            --dark: #1a1612;
            --dark2: #2c2520;
            --cream: #f5f0e8;
            --text-muted: #9a8f82;
        }
        body {
            background: var(--dark);
            color: var(--cream);
            font-family: 'Jost', sans-serif;
        }
        .admin-navbar {
            background: var(--dark2);
            border-bottom: 1px solid rgba(201,169,110,0.2);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-logo {
            font-size: 20px;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 2px;
        }
        .admin-logo span {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 3px;
            display: block;
            font-weight: 300;
        }
        .back-btn {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-decoration: none;
            border: 1px solid rgba(201,169,110,0.2);
            padding: 8px 20px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            color: var(--gold);
            border-color: var(--gold);
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 32px;
        }
        .stat-card {
            background: var(--dark2);
            border: 1px solid rgba(201,169,110,0.1);
            padding: 24px;
            text-align: center;
        }
        .stat-num {
            font-size: 36px;
            font-weight: 600;
            color: var(--gold);
        }
        .stat-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .table-section {
            padding: 0 32px 32px;
        }
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar select, .filter-bar input {
            background: var(--dark2);
            border: 1px solid rgba(201,169,110,0.2);
            color: var(--cream);
            padding: 8px 16px;
            font-size: 13px;
            outline: none;
        }
        .filter-bar select option {
            background: var(--dark);
        }
        .appointments-table {
            width: 100%;
            border-collapse: collapse;
        }
        .appointments-table th {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(201,169,110,0.2);
            background: var(--dark2);
        }
        .appointments-table td {
            padding: 14px 16px;
            font-size: 13px;
            color: var(--cream);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .appointments-table tr:hover td {
            background: rgba(201,169,110,0.03);
        }
        .status-badge {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 2px;
        }
        .status-PENDING {
            background: rgba(255,193,7,0.15);
            color: #ffc107;
            border: 1px solid rgba(255,193,7,0.3);
        }
        .status-CONFIRMED {
            background: rgba(40,167,69,0.15);
            color: #28a745;
            border: 1px solid rgba(40,167,69,0.3);
        }
        .status-CANCELLED {
            background: rgba(220,53,69,0.15);
            color: #dc3545;
            border: 1px solid rgba(220,53,69,0.3);
        }
        .action-btn {
            font-size: 11px;
            padding: 5px 12px;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin: 2px;
        }
        .btn-confirm {
            background: rgba(40,167,69,0.2);
            color: #28a745;
            border: 1px solid rgba(40,167,69,0.3);
        }
        .btn-confirm:hover { background: #28a745; color: white; }
        .btn-cancel {
            background: rgba(220,53,69,0.2);
            color: #dc3545;
            border: 1px solid rgba(220,53,69,0.3);
        }
        .btn-cancel:hover { background: #dc3545; color: white; }
        .section-heading {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 20px;
        }
        .no-data {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr 1fr; padding: 16px; }
            .table-section { padding: 0 16px 16px; }
            .admin-navbar { padding: 16px; }
            .appointments-table { font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="admin-navbar">
    <div class="admin-logo">
        MP09 Family Saloon
        <span>Admin Dashboard</span>
    </div>
    <a href="/" class="back-btn">← Back to Website</a>
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="back-btn" style="cursor:pointer; background:transparent;">
            Logout →
        </button>
    </form>
    <a href="/admin/change-password" class="back-btn" style="margin-right: 8px;">
        Change Password
    </a>
    <a href="/admin/add-admin" class="back-btn" style="margin-right: 8px;">
        Add Admin
    </a>
</div>

<!-- STATS -->
<div class="stats-row">
    <div class="stat-card">
        <div class="stat-num" th:text="${appointments.size()}">0</div>
        <div class="stat-label">Total Bookings</div>
    </div>
    <div class="stat-card">
        <div class="stat-num" th:text="${pendingCount}">0</div>
        <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
        <div class="stat-num" th:text="${confirmedCount}">0</div>
        <div class="stat-label">Confirmed</div>
    </div>
    <div class="stat-card">
        <div class="stat-num" th:text="${cancelledCount}">0</div>
        <div class="stat-label">Cancelled</div>
    </div>
</div>

<!-- TABLE -->
<div class="table-section">
    <p class="section-heading">All Appointments</p>

    <!-- FILTER -->
    <div class="filter-bar">
        <select id="filterLocation" onchange="filterTable()">
            <option value="">All Locations</option>
            <option value="bhawar">Bhawar Kua</option>
            <option value="ranjeet">Ranjeet Road</option>
            <option value="kesar">Kesar Bagh</option>
        </select>
        <select id="filterStatus" onchange="filterTable()">
            <option value="">All Status</option>
            <option value="PENDING">Pending</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="CANCELLED">Cancelled</option>
        </select>
        <input type="date" id="filterDate" onchange="filterTable()">
    </div>

    <!-- TABLE -->
    <div style="overflow-x: auto;">
        <table class="appointments-table" id="appointmentsTable">
            <thead>
            <tr>
                <th>#</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Location</th>
                <th>Stylist</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="apt : ${appointments}"
                th:attr="data-location=${apt.location}, data-status=${apt.status}, data-date=${apt.date}">
                <td th:text="${apt.id}"></td>
                <td th:text="${apt.customerName}"></td>
                <td th:text="${apt.phone}"></td>
                <td th:text="${apt.location}"></td>
                <td th:text="${apt.stylist}"></td>
                <td th:text="${apt.date}"></td>
                <td th:text="${apt.timeSlot}"></td>
                <td>
                            <span class="status-badge"
                                  th:classappend="'status-' + ${apt.status}"
                                  th:text="${apt.status}">
                            </span>
                </td>
                <td>
                    <form th:action="@{/admin/update-status}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="id" th:value="${apt.id}">
                        <input type="hidden" name="status" value="CONFIRMED">
                        <button type="submit" class="action-btn btn-confirm">✓ Confirm</button>
                    </form>
                    <form th:action="@{/admin/update-status}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="id" th:value="${apt.id}">
                        <input type="hidden" name="status" value="CANCELLED">
                        <button type="submit" class="action-btn btn-cancel">✕ Cancel</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${appointments.empty}">
                <td colspan="9" class="no-data">No appointments yet!</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function filterTable() {
        const location = document.getElementById('filterLocation').value.toLowerCase();
        const status = document.getElementById('filterStatus').value.toUpperCase();
        const date = document.getElementById('filterDate').value;
        const rows = document.querySelectorAll('#appointmentsTable tbody tr');

        rows.forEach(row => {
            const rowLocation = row.getAttribute('data-location') || '';
            const rowStatus = row.getAttribute('data-status') || '';
            const rowDate = row.getAttribute('data-date') || '';

            const locationMatch = !location || rowLocation.includes(location);
            const statusMatch = !status || rowStatus === status;
            const dateMatch = !date || rowDate === date;

            row.style.display = (locationMatch && statusMatch && dateMatch) ? '' : 'none';
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
